<style>
/* ── The hull: constants ─────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:#1C1E21}
:root{
  --graphite:#1C1E21;--bone:#CFC9BE;--seam:#5A6570;--lit:#EFE6D2;
  --ember:#B4552F;--silt:#6E8794;--brick:#A8763C;--oxblood:#6E2B33;--gold:#D9C48A;--shore:#7E9B86;
  --frame:'Inter Tight','Helvetica Neue',Arial,sans-serif;
  --body:'EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
  --f1:'Cinzel','Trajan Pro','Times New Roman',serif;
  --f2:'Cormorant','EB Garamond',Georgia,serif;
  --f3:'Grenze Gotisch','EB Garamond',Georgia,serif;
  --f4:'IM Fell English','EB Garamond',Georgia,serif;
  --f5:'Bodoni Moda','Didot','Bodoni MT','Times New Roman',serif;
  --f6:'Julius Sans One','Inter Tight','Helvetica Neue',sans-serif;
  --gut:clamp(18px,4.4vw,64px);
  --u:max(1vh,5px);--seam-y:calc(64*var(--u));
  --ease:cubic-bezier(.3,.1,.2,1);
}
@supports (height:1svh){:root{--u:max(1svh,5px)}}
body{margin:0;background:var(--graphite);color:var(--bone);font-family:var(--body);font-size:19px;line-height:1.55;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;overflow-x:clip}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--lit);outline-offset:3px}
::selection{background:rgba(207,201,190,.86);color:var(--graphite)}
.vh{position:absolute!important;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.lab{margin:0;font:500 11px/1.3 var(--frame);letter-spacing:.22em;text-transform:uppercase;color:rgba(207,201,190,.66)}
main{position:relative;z-index:1}

/* ── The hull: plate metal, brushed along its length, seamed and riveted. Fixed; it never
      changes while the realms pass. ── */
.hull{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;--ln:rgba(0,0,0,.62);--hi:rgba(168,180,194,.2);background:
  radial-gradient(ellipse 70% 46% at 22% 26%,rgba(140,152,166,.13),rgba(140,152,166,0) 70%),
  radial-gradient(ellipse 70% 50% at 90% 100%,rgba(0,0,0,.42),rgba(0,0,0,0) 70%),
  linear-gradient(180deg,#22252A 0,#1B1D21 52%,#15171A 100%)}
.hull::before{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='512'%20height='512'%3E%3Cfilter%20id='n'%20x='0'%20y='0'%20width='100%25'%20height='100%25'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='0.0022%200.55'%20numOctaves='2'%20seed='6'%20stitchTiles='stitch'/%3E%3CfeColorMatrix%20type='matrix'%20values='0%200%200%200%200.74%200%200%200%200%200.79%200%200%200%200%200.86%200.8%200%200%200%20-0.34'/%3E%3C/filter%3E%3Crect%20width='100%25'%20height='100%25'%20filter='url(%23n)'/%3E%3C/svg%3E");opacity:.24}
/* the plate catches whatever light there is: a soft sheen that follows the pointer */
.hull::after{content:"";position:absolute;inset:0;background:radial-gradient(46vmax circle at var(--hx,28%) var(--hy,22%),rgba(196,208,224,.075),rgba(196,208,224,.025) 42%,rgba(196,208,224,0) 70%);transition:background-position .6s}
.hull-bays{position:absolute;inset:0 var(--gut);display:grid;grid-template-columns:repeat(6,1fr);counter-reset:bay}
.hull-bays i{position:relative;border-left:1px solid var(--ln);box-shadow:inset 1px 0 0 var(--hi);counter-increment:bay}
.hull-bays i:last-child{border-right:1px solid var(--ln);box-shadow:inset 1px 0 0 var(--hi),1px 0 0 var(--hi)}
.hull-bays i::before{content:"";position:absolute;left:-5px;top:-96px;bottom:-96px;width:11px;background:radial-gradient(circle at 50% 6px,rgba(196,204,214,.62) 0,rgba(150,160,172,.5) 1.3px,rgba(0,0,0,.7) 2.4px,rgba(0,0,0,0) 3.4px) 0 0/11px 96px repeat-y;transform:translateY(var(--creep,0px))}
.hull-bays i::after{content:counter(bay,decimal-leading-zero);position:absolute;left:10px;top:calc(var(--seam-y) + 11px);font:500 9px/1 var(--frame);letter-spacing:.16em;color:rgba(150,162,176,.5)}
.hull.fwd .hull-bays,.hull.fwd .hull-arc,.hull.fwd .hull-seam{filter:brightness(calc(1 + .7*var(--fwd,0)))}
.hull-seam{position:absolute;left:0;right:0;top:var(--seam-y);height:3px;margin-top:-1px;background:linear-gradient(to bottom,rgba(0,0,0,.7) 0,rgba(0,0,0,.7) 1px,rgba(176,188,202,.3) 1px,rgba(176,188,202,.3) 2px,rgba(0,0,0,0) 2px)}
.hull-arc{position:absolute;left:50%;aspect-ratio:1;border:1px solid rgba(0,0,0,.45);box-shadow:0 1px 0 rgba(168,180,194,.1);border-radius:50%;transform:translateX(-50%)}
.hull-arc.fl{width:calc(230% + 60vh);bottom:calc(100% - var(--seam-y))}
.hull-arc.fl.b{width:calc(230% + 60vh + 40px);bottom:calc(100% - var(--seam-y) - 20px)}
.hull-arc.va{width:calc(250% + 40vh);top:calc(8*var(--u))}
.hull-arc.va.b{width:calc(250% + 40vh + 28px);top:calc(8*var(--u) - 14px)}

/* The same ribs, drawn over every room: the sky is a picture standing in the hull, and the
   joints show through it. The horizontal joint lies exactly on that room's horizon. */
.ribs{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden;--bw:calc((100% - 2*var(--gut))/6)}
.ribs i{position:absolute;top:0;bottom:0;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.24) 0,rgba(0,0,0,.24) 1px,rgba(230,224,212,.11) 1px)}
.ribs i:nth-child(1){left:var(--gut)}
.ribs i:nth-child(2){left:calc(var(--gut) + var(--bw))}
.ribs i:nth-child(3){left:calc(var(--gut) + 2*var(--bw))}
.ribs i:nth-child(4){left:calc(var(--gut) + 3*var(--bw))}
.ribs i:nth-child(5){left:calc(var(--gut) + 4*var(--bw))}
.ribs i:nth-child(6){left:calc(var(--gut) + 5*var(--bw))}
.ribs i:nth-child(7){left:calc(100% - var(--gut) - 1px)}
.ribs b{position:absolute;left:0;right:0;top:calc(var(--fy,.64)*100%);height:2px;margin-top:-1px;background:linear-gradient(to bottom,rgba(0,0,0,.3) 0,rgba(0,0,0,.3) 1px,rgba(230,224,212,.2) 1px)}

/* ── The frame: the hull's label strip ───────────────────────────── */
.frame{position:absolute;inset:0 0 auto 0;z-index:60;height:56px;padding:0 var(--gut);display:flex;align-items:center;gap:clamp(12px,2vw,26px);font:500 11px/1 var(--frame);letter-spacing:.2em;text-transform:uppercase;color:rgba(207,201,190,.86);--lamp:#EFE6D2}
.js .frame{position:fixed}
.frame::before{content:"";position:absolute;inset:0 0 -26px 0;z-index:-1;pointer-events:none;background:linear-gradient(to bottom,rgba(28,30,33,.86),rgba(28,30,33,.5) 58%,rgba(28,30,33,0));-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);-webkit-mask-image:linear-gradient(to bottom,#000 60%,transparent);mask-image:linear-gradient(to bottom,#000 60%,transparent)}
.frame.l:not(.past-hero)::before{display:none}
.frame.on-light{color:rgba(28,30,33,.86)}
.frame.on-light::before{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(to bottom,#D6D0C5 0,#D6D0C5 66%,rgba(214,208,197,0))}
.frame a{color:inherit;text-decoration:none}
.frame-home{margin-right:auto;display:inline-flex;align-items:center;gap:11px;min-height:44px;transition:opacity .6s}
.frame-home svg{width:17px;height:17px;flex:none}
.rail{display:flex;align-items:flex-start;height:34px;transition:opacity .6s}
.rail a{position:relative;display:block;width:20px;height:34px;color:rgba(207,201,190,.45);transform:translateY(var(--ry,0px));transition:color .7s,transform 1.1s var(--ease)}
.rail a svg{display:block;width:12px;height:30px;margin:0 auto;overflow:visible}
.rail a:hover{color:rgba(207,201,190,.95)}
.rail a.is-lit{color:var(--lamp);--lf:var(--lamp);--lc:#FFF8E6}
.rail a.is-lit svg{filter:drop-shadow(0 0 6px var(--lamp))}
.frame.all-lit .rail a{transform:none}
.frame.on-light .rail a{color:rgba(28,30,33,.45)}
.frame.on-light .rail a.is-lit{color:#1C1E21;--lf:#1C1E21;--lc:#CFC9BE}
.frame.on-light .rail a.is-lit svg{filter:none}
.frame.l:not(.past-hero) .rail,.frame.l:not(.past-hero) .frame-home{opacity:0;visibility:hidden}
.frame .nar{display:none}
@media (max-width:760px){
  .frame{height:50px;font-size:10px;letter-spacing:.18em}
  .frame .wide{display:none}.frame .nar{display:inline}
}
@media (max-width:359px){.frame{gap:10px}.frame-home .nar{display:none}}

/* ── The lamp glyph (one symbol, used everywhere) ────────────────── */
.lamp-g{display:block;overflow:visible}

/* ── Buying. One shape everywhere: a solid plate, a plain verb, the series' voice beneath.
      Coming = flat. Live (a RETAIL slot is filled) = the lamp in it is lit and it glows. ── */
.buy{display:inline-grid;grid-template-columns:auto auto;justify-content:start;align-items:center;column-gap:13px;padding:12px 22px 11px 15px;background:var(--buy-bg,#EFE6D2);color:var(--buy-ink,#1C1E21);text-decoration:none;text-align:left;border-radius:2px;line-height:1.1;box-shadow:0 12px 26px -14px rgba(0,0,0,.75);transition:transform .25s,filter .25s,box-shadow .35s}
.buy .lamp-g{grid-row:1/3;width:13px;height:33px;opacity:.62}
.buy b{font:500 clamp(18px,1.4vw,21px)/1.1 var(--body);letter-spacing:.002em;white-space:nowrap}
.buy small{grid-column:2;margin-top:5px;font:500 9.5px/1.2 var(--frame);letter-spacing:.18em;text-transform:uppercase;opacity:.74;white-space:nowrap}
.buy{background-image:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 46%,rgba(0,0,0,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(0,0,0,.25),0 12px 26px -14px rgba(0,0,0,.8)}
.buy:hover{transform:translateY(-2px);filter:brightness(1.08);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.25),0 18px 30px -14px rgba(0,0,0,.85)}
.buy:active{transform:translateY(1px);filter:brightness(.96);box-shadow:inset 0 2px 5px rgba(0,0,0,.35)}
.buy:focus-visible,.ed-buy:focus-visible,.bar:focus-visible b{outline:2px solid var(--buy-ink,#1C1E21);outline-offset:-5px;box-shadow:0 0 0 3px var(--buy-bg,#EFE6D2),0 0 0 5px rgba(239,230,210,.5)}
.buy.is-live{box-shadow:0 0 0 1px rgba(255,255,255,.4) inset,0 0 0 4px var(--buy-halo,rgba(239,230,210,.2)),0 16px 40px -10px var(--buy-glow,rgba(239,230,210,.55))}
.buy.is-live .lamp-g{opacity:1;--lf:currentColor;--lc:var(--buy-bg,#EFE6D2)}
.buy.is-live b{font-weight:600}
.buy.s{display:inline-flex;padding:9px 15px 8px;box-shadow:none}
.buy.s b{font-size:16px}
.more{display:inline-block;padding:10px 0 8px;font:500 10.5px/1 var(--frame);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid currentColor;opacity:.86;white-space:nowrap}
.more:hover{opacity:1;border-bottom-color:transparent}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px}
@media (max-width:359px){.buy{padding:10px 14px 9px 11px;column-gap:9px;max-width:100%}.buy b{font-size:16px}.buy small{font-size:8.5px;letter-spacing:.12em}}

/* The persistent control: the book on screen and the plain verb. In the frame on wide
   screens; a strip along the bottom edge on phones. Present once the hero has gone. */
.bar{display:none}
.js .bar{display:inline-flex;align-items:center;gap:11px;min-height:40px;text-decoration:none;transition:opacity .5s,visibility .5s,transform .5s var(--ease)}
.frame:not(.past-hero) .bar{opacity:0;visibility:hidden;pointer-events:none}
.bar-thumb{display:block;width:22px;height:34px;object-fit:cover;flex:none;box-shadow:0 0 0 1px rgba(207,201,190,.3)}
.bar-t{white-space:nowrap}
.bar b{display:block;padding:9px 13px 8px;background:var(--buy-bg,#EFE6D2);color:var(--buy-ink,#1C1E21);border-radius:2px;font:500 15.5px/1 var(--body);letter-spacing:0;text-transform:none;white-space:nowrap;transition:background .6s,color .6s,filter .25s}
.bar:hover b{filter:brightness(1.08)}
.bar.is-live b{font-weight:600;box-shadow:0 0 0 3px var(--buy-halo,rgba(239,230,210,.2)),0 6px 22px -4px var(--buy-glow,rgba(239,230,210,.55))}
@media (min-width:761px){
  .frame.on-light .bar:not([style*="--buy-bg"]) b{background:#1C1E21;color:#EFE6D2}
  .frame.on-light .bar-thumb{box-shadow:0 0 0 1px rgba(28,30,33,.4)}
}
@media (max-width:1000px) and (min-width:761px){.bar-t{display:none}}
@media (max-width:760px){
  .js .bar{position:fixed;left:0;right:0;bottom:0;z-index:70;display:flex;gap:12px;min-height:0;height:calc(56px + env(safe-area-inset-bottom));padding:0 var(--gut) env(safe-area-inset-bottom);background:rgba(24,26,29,.97);border-top:1px solid rgba(90,101,112,.9);color:#E6E0D5;font:500 10px/1.2 var(--frame);letter-spacing:.16em;text-transform:uppercase}
  .frame:not(.past-hero) .bar{transform:translateY(100%)}
  .bar-thumb{width:26px;height:40px}
  .bar-t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font:400 17px/1.1 var(--body);letter-spacing:0;text-transform:none}
  .bar b{padding:11px 15px 10px;font-size:16px}
}

/* ── Editions: six things you can pick up. A quiet chip while coming; a solid button when live. ── */
.eds{display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(18px,2.4vw,36px)}
.eds-g h3{margin:0 0 10px;font:500 11px/1.3 var(--frame);letter-spacing:.22em;text-transform:uppercase;color:var(--eds-lab,rgba(207,201,190,.7))}
.eds-g ul{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,1vw,14px)}
.ed{display:flex;flex-direction:column;min-width:0}
.ed-art{position:relative;aspect-ratio:1;display:grid;place-items:center;overflow:hidden;background:var(--eds-box,#15171a);box-shadow:inset 0 0 0 1px rgba(207,201,190,.12)}
.ed-art img{display:block}
/* absolutely placed, so the percentage heights mean the same thing in Safari as in Chrome */
.ed-ebook img,.ed-paper img,.ed-hard img{position:absolute;left:50%;top:50%;max-width:none;transform:translate(-50%,-50%)}
.ed-sq img{width:100%;height:100%;object-fit:cover}
.ed-ebook img{height:74%;width:auto;border-radius:5px;box-shadow:0 0 0 5px #0b0c0e,0 0 0 6px rgba(207,201,190,.4),0 14px 22px -8px rgba(0,0,0,.8)}
.ed-paper img{height:80%;width:auto;transform:translate(-50%,-50%) rotate(-4deg);box-shadow:-2px 0 0 rgba(255,255,255,.14),6px 10px 18px -4px rgba(0,0,0,.8)}
.ed-hard img{height:78%;width:auto;border-radius:1px 3px 3px 1px;box-shadow:0 0 0 2px #2b2622,4px 0 0 2px #2b2622,7px 2px 0 1px rgba(226,220,208,.75),8px 12px 20px -2px rgba(0,0,0,.85)}
.ed-name{display:block;margin-top:11px;font-size:clamp(16px,1.3vw,19px);line-height:1.15}
.ed-note{display:block;margin-top:2px;font-style:italic;font-size:14.5px;line-height:1.25;color:var(--eds-mute,rgba(207,201,190,.7))}
.ed-state{align-self:flex-start;margin-top:9px;padding:5px 8px 4px;border:1px solid var(--eds-rule,rgba(207,201,190,.34));border-radius:2px;font:500 9px/1 var(--frame);letter-spacing:.2em;text-transform:uppercase;color:var(--eds-mute,rgba(207,201,190,.7))}
.ed-buy{align-self:flex-start;margin-top:9px;padding:8px 12px 7px;background:var(--buy-bg,#EFE6D2);color:var(--buy-ink,#1C1E21);border-radius:2px;font:600 15px/1.1 var(--body);text-decoration:none;box-shadow:0 0 0 3px var(--buy-halo,rgba(239,230,210,.18)),0 8px 20px -8px var(--buy-glow,rgba(239,230,210,.5));transition:filter .25s,transform .25s}
.ed-buy:hover{filter:brightness(1.07);transform:translateY(-1px)}
.ed.is-live .ed-art{box-shadow:inset 0 0 0 1px var(--buy-bg,#EFE6D2)}
.eds-note{margin:18px 0 0;font-style:italic;font-size:16px;line-height:1.4;color:var(--eds-mute,rgba(207,201,190,.7))}
@media (max-width:760px){
  .eds{grid-template-columns:1fr;gap:24px 0}
  .ed-name{font-size:15.5px}.ed-note{font-size:13px}
  .ed-buy{font-size:14px;padding:7px 9px 6px}
}

/* ── Colophon, with the author's paragraph ───────────────────────── */
.colophon{position:relative;background:rgba(28,30,33,.94);padding:clamp(54px,9vh,96px) var(--gut) calc(40px + env(safe-area-inset-bottom))}
.colo-grid{display:grid;grid-template-columns:repeat(6,1fr);row-gap:26px;align-items:start}
.colo-author{grid-column:1/4;margin:0;padding-right:clamp(0px,2vw,30px)}
.colo-author .lab{margin-bottom:12px}
.colo-author p{margin:0;font-size:clamp(19px,1.7vw,24px);line-height:1.32;color:#DDD7CC;text-wrap:pretty;max-width:30ch}
.colo-col{grid-column:span 1;font:500 11px/1.9 var(--frame);letter-spacing:.2em;text-transform:uppercase;color:rgba(207,201,190,.66)}
.colo-col.c2{grid-column:5/7}
.colo-col b{display:block;font-weight:500;color:rgba(207,201,190,.92)}
.colo-col a{text-decoration:none;border-bottom:1px solid rgba(207,201,190,.4);color:rgba(207,201,190,.92)}
.colo-col a:hover{border-bottom-color:var(--bone)}
.colo-foot{grid-column:1/-1;margin:clamp(20px,5vh,54px) 0 0;padding-top:16px;border-top:1px solid rgba(90,101,112,.7);display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px;font:500 10px/1.6 var(--frame);letter-spacing:.2em;text-transform:uppercase;color:rgba(207,201,190,.56)}
@media (max-width:760px){
  .colo-author{grid-column:1/-1;padding:0}.colo-col.c2{grid-column:1/-1}
  .js .colophon{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
}

/* ── Arrivals (armed by the engine only) ─────────────────────────── */
.rv{opacity:0;transform:translateY(16px);transition:opacity 1.1s var(--ease),transform 1.1s var(--ease)}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition-duration:.001ms!important}
}

/* ── A room: one realm, built in light (light.js), with its book standing in it. The still
      picture under the canvas is a frame of the same built scene. ── */
.scene{position:absolute;inset:0;display:block;width:100%;height:100%;opacity:0;transition:opacity 1.2s var(--ease);pointer-events:none}
.scene.on{opacity:1}
.realm{position:relative;height:clamp(560px,calc(78*var(--u)),780px);overflow:hidden;isolation:isolate;color:var(--bone);--fx:.70;--fy:.60;--zoom:1;--lx:var(--fx)}
.realm.flip{--fx:.30}
/* the room's own lamp, hung in the hull above its subject; the scene is lit from it */
.r-lamp{position:absolute;z-index:0;left:calc(var(--lx)*100%);top:0;width:34px;margin-left:-17px;height:clamp(92px,16%,140px);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.r-lamp::before{content:"";flex:1;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(190,170,120,.6) 50%,rgba(0,0,0,.4))}
.r-lamp svg{flex:none;width:clamp(22px,2.3vw,32px);height:auto;aspect-ratio:48/120;overflow:visible}
/* its glow is a gradient, not a filter: Safari draws a stray black block for filtered lamps here */
.r-lamp::after{content:"";position:absolute;left:50%;bottom:-14px;width:110px;height:110px;margin-left:-55px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,224,165,.5),rgba(255,214,150,.16) 45%,rgba(255,214,150,0));pointer-events:none}
.realm .art{position:absolute;inset:0;z-index:-3;overflow:hidden;background:#141517}
.realm .art img{display:block;width:100%;height:100%;object-fit:cover;object-position:70% 50%}
.realm.flip .art img{transform:scaleX(-1)}
.realm .veil{position:absolute;inset:0;z-index:-1;pointer-events:none;background:
  linear-gradient(90deg,rgba(11,12,14,.82) 0,rgba(11,12,14,.58) 30%,rgba(11,12,14,0) 60%),
  linear-gradient(to top,rgba(11,12,14,.6) 0,rgba(11,12,14,0) 38%),
  linear-gradient(to bottom,rgba(11,12,14,.5) 0,rgba(11,12,14,0) 20%)}
.realm.flip .veil{transform:scaleX(-1)}
.realm::after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.6),inset 0 2px 0 rgba(207,201,190,.10),inset 0 22px 30px -22px rgba(0,0,0,.8),inset 0 -22px 30px -22px rgba(0,0,0,.8)}
.realm .in{position:absolute;z-index:1;left:var(--gut);bottom:clamp(30px,7.4%,62px);max-width:66%;display:grid;grid-template-columns:auto minmax(0,440px);grid-template-areas:"cover head" "cover txt";grid-template-rows:1fr auto;column-gap:clamp(22px,3vw,48px);align-items:end}
.realm.flip .in{left:auto;right:var(--gut);grid-template-columns:minmax(0,440px) auto;grid-template-areas:"head cover" "txt cover"}
.realm .head{grid-area:head}
.realm .txt{grid-area:txt}
/* the book: its real cover, whole, standing in its own realm */
.cover{position:relative;display:block;aspect-ratio:970/1500;background:#15171a;border-radius:1px 3px 3px 1px;box-shadow:3px 0 0 -1px #cfc8b8,4px 1px 0 -1px #6f695c,5px 0 0 -1px #cfc8b8,6px 2px 0 -1px #57524a,30px 40px 56px -22px rgba(0,0,0,.95),0 3px 10px rgba(0,0,0,.55);transition:transform .6s var(--ease),box-shadow .6s var(--ease)}
.cover img{display:block;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.cover::before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,rgba(0,0,0,.42) 0,rgba(255,255,255,.2) 1.3%,rgba(0,0,0,.2) 3.2%,rgba(0,0,0,0) 6.5%),linear-gradient(115deg,rgba(255,255,255,.14) 0,rgba(255,255,255,0) 30%,rgba(0,0,0,0) 62%,rgba(0,0,0,.26) 100%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}
a.cover:hover{transform:translateY(-6px) rotate(-.6deg)}
a.cover:active{transform:translateY(-1px)}
.realm .cover{grid-area:cover;height:clamp(300px,calc(58*var(--u)),540px)}
.realm .ord{margin:0 0 clamp(10px,1.6vh,18px);display:flex;align-items:center;gap:12px;font:500 11px/1 var(--frame);letter-spacing:.24em;text-transform:uppercase;color:var(--ink)}
.realm .ord b{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 7px;border:1px solid currentColor;border-radius:50%;font-weight:500;letter-spacing:.06em}
.realm .title{margin:0;font-weight:400;color:#F3EDE2;text-wrap:balance;text-shadow:0 2px 30px rgba(6,6,7,.75)}
.realm .hook{margin:clamp(14px,2.4vh,24px) 0 0;max-width:30ch;font-size:clamp(18px,1.55vw,23px);line-height:1.32;color:#EAE4D9;text-wrap:pretty;text-shadow:0 1px 16px rgba(6,6,7,.8)}
.realm .acts{margin-top:clamp(16px,2.6vh,26px)}
.realm .more{color:#E4DED3}
@media (max-width:860px){
  .realm{height:clamp(560px,calc(72*var(--u)),620px);--fx:.5;--fy:.44;--lx:.86}
  .realm.flip{--fx:.5}
  .r-lamp{height:74px}
  .r-lamp svg{width:20px}
  .realm .art img{object-position:50% 50%}
  .realm .veil,.realm.flip .veil{transform:none;background:
    linear-gradient(to bottom,rgba(11,12,14,.84) 0,rgba(11,12,14,.62) 20%,rgba(11,12,14,.3) 34%,rgba(11,12,14,0) 46%),
    linear-gradient(to top,rgba(11,12,14,.94) 0,rgba(11,12,14,.86) 30%,rgba(11,12,14,.4) 48%,rgba(11,12,14,0) 62%)}
  .realm .in,.realm.flip .in{left:var(--gut);right:var(--gut);top:66px;bottom:22px;max-width:none;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"head head" "cover txt";column-gap:16px}
  .realm .head{align-self:start}
  .realm .cover{height:auto;width:clamp(118px,38vw,170px)}
  .realm .ord{margin-bottom:10px;font-size:10px}
  .realm .ord b{min-width:26px;height:26px}
  .realm .hook{margin-top:0;font-size:16.5px;line-height:1.3;max-width:none}
  .realm .acts{margin-top:12px}
  .realm .acts .more{display:none}
  .realm .buy{padding:9px 14px 8px 11px;column-gap:9px;max-width:100%}
  .realm .buy{grid-template-columns:auto}
  .realm .buy .lamp-g{display:none}
  .realm .buy b{font-size:16.5px;white-space:normal}
  .realm .buy small{display:none}
}
@media (max-width:359px){.realm .hook{font-size:15px}.realm .buy b{font-size:15px}}

.lost{position:relative;min-height:calc(100*var(--u));isolation:isolate;overflow:hidden}
.lost-veil{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse 70% 60% at 50% 30%,rgba(14,15,17,.2),rgba(14,15,17,.72))}
.lamps{position:absolute;inset:0 var(--gut);margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(6,1fr)}
.lamps li{position:relative}
.lamp{position:absolute;left:50%;top:0;width:44px;margin-left:-22px;height:calc(var(--h)*var(--u));display:flex;flex-direction:column;align-items:center;opacity:.8}
.lamp::before{content:"";flex:1;width:2px;background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(190,170,120,.4) 50%,rgba(0,0,0,.4))}
.lamp svg{flex:none;width:clamp(26px,3vw,44px);height:auto;aspect-ratio:48/120;overflow:visible}
.lost-copy{position:absolute;left:var(--gut);right:var(--gut);top:64%;padding-top:calc(4*var(--u))}
.lost-copy .lab{position:absolute;left:0;bottom:calc(100% + 16px)}
.lost-copy h1{margin:0;font:400 clamp(34px,5.6vw,84px)/.98 var(--body);letter-spacing:-.016em;color:#EDE7DC;text-wrap:balance}
.lost-copy p.say{margin:calc(2*var(--u)) 0 0;max-width:40ch;font-size:clamp(17px,1.5vw,22px);line-height:1.42;color:rgba(217,211,200,.9);text-wrap:pretty}
.lost-copy .acts{margin-top:calc(2.6*var(--u))}

</style>
</head>
