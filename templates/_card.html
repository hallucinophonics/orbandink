<article class="card" style="--accent-book:{{C_ACCENT}}" data-series="{{C_SERIES}}" data-themes="{{C_THEMES}}" data-reveal>
  <a href="{{REL}}{{LANG}}/books/{{C_SLUG}}/">
    <div class="card-top mono-meta"><span class="idx">{{C_IDX}}</span><span>{{C_YEAR}} · {{C_META_RIGHT}}</span></div>
    <div class="cover-box" data-fx data-book="{{C_ID}}" data-accent="{{C_ACCENT}}">
      <img src="{{REL}}{{C_COVER}}"{{C_SRCSET}} alt="{{C_ALT}}" width="800" height="1200" loading="lazy">
      <span class="tick tk-a" aria-hidden="true"></span><span class="tick tk-b" aria-hidden="true"></span>
    </div>
    <h3 data-decode-hover>{{C_TITLE}}</h3>
    <p class="tagline">{{C_TAGLINE}}</p>
  </a>
</article>
