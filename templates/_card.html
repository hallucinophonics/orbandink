<article class="card" style="--accent-book:{{C_ACCENT}}" data-series="{{C_SERIES}}" data-themes="{{C_THEMES}}" data-ways="{{C_WAYS}}" data-byline="{{C_BYLINE_KEY}}" data-status="{{C_STATUS}}" data-search="{{C_SEARCH}}" data-reveal>
  <a class="card-link" href="{{REL}}{{LANG}}/books/{{C_SLUG}}/">
    {{C_BOOK3D}}

    <p class="tagline">{{C_TAGLINE}}</p>
    <div class="card-foot mono-meta"><span>{{C_BYLINE}}</span><span class="ways">{{C_WAYS_ICONS}}</span></div>
  </a>
</article>
