<div class="page-title-wrap page-title-wrap--shelf">
  <p class="kicker"><i class="dot" aria-hidden="true"></i>{{KICKER}}</p>
  <h1 class="page-title"><span class="fx-erode">{{T_BOOKS_TITLE}}</span><sup class="page-count" aria-hidden="true">{{N_BOOKS}}</sup></h1>
  <p class="page-sub">{{T_LEDE}}</p>
</div>
<section class="section shelf-sec" data-filterable>
  <form class="filters" role="search" aria-label="{{T_FILTERS}}" onsubmit="return false">
{{FILTER_BAR}}  </form>
  <div class="grid-books shelf" data-shelf>
{{CARDS}}
  </div>
  <p class="fnone" hidden>{{T_NONE}}</p>
</section>
