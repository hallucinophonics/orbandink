<div class="page-title-wrap">
  <p class="kicker"><i class="dot" aria-hidden="true"></i>{{KICKER}}</p>
  <h1 class="page-title"><span class="fx-erode">{{T_ABOUT_TITLE}}</span><sup class="page-count" aria-hidden="true">{{N_AUTHORS}}</sup></h1>
  <p class="page-sub page-sub--lg">{{AUTHORS_INTRO}}</p>
</div>
<section class="astages">
{{ROSTER}}
</section>
<section class="section press-contact">
  <div class="press-note" data-reveal>
    <span class="kicker">{{T_PRESS}}</span>
    <p>{{PRESS_BODY}}</p>
  </div>
  <div class="contact-list" data-reveal>
    <span class="kicker">{{T_CONTACT}}</span>
    <a href="mailto:{{EMAIL}}">{{EMAIL}}</a>
{{SOCIAL_LINKS}}
  </div>
</section>
