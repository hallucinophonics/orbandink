<section class="hero">
  <p class="hero-kicker kicker">{{KICKER}}</p>
  <div class="hero-word-wrap">
    <h1 class="hero-word" data-words="{{HERO_WORDS}}" data-glyphs="{{GLYPHS}}">{{HERO_WORD}}</h1>
  </div>
  <div class="hero-foot">
    <span class="mono-meta">{{T_TAGLINE}}</span>
    <span class="mono-meta scroll-cue">{{T_SCROLL}}</span>
  </div>
</section>

<div class="ticker" aria-hidden="true">
  <div class="ticker-track">
    <div class="ticker-seg">{{TICKER}}</div>
    <div class="ticker-seg">{{TICKER}}</div>
  </div>
</div>

<section class="section" style="--accent-book:{{F_ACCENT}}">
  <span class="sec-num" aria-hidden="true" data-plx>01</span>
  <div class="sec-mark" data-reveal><span class="idx">01</span><span class="lbl" data-decode>{{T_FEATURED}}{{F_SERIES_META}}</span></div>
  <div class="featured">
    <div class="cover-col" data-reveal>
      <div class="cover-box" data-fx data-book="{{F_ID}}" data-accent="{{F_ACCENT}}"{{F_PLATE}}>
        <img src="{{REL}}{{F_COVER}}"{{F_SRCSET}} alt="{{F_COVER_ALT}}" width="800" height="1200" fetchpriority="high">
        <span class="tick tk-a" aria-hidden="true"></span><span class="tick tk-b" aria-hidden="true"></span>
      </div>
      <div class="cover-reflect" aria-hidden="true"></div>
    </div>
    <div>
      <h2 class="featured-title fx-erode" data-accent="{{F_ACCENT}}"><a href="{{F_URL}}">{{F_TITLE}}</a></h2>
      <p class="tagline" data-reveal>{{F_TAGLINE}}</p>
      <div class="data-strip mono-meta" data-reveal>
{{F_DATA}}
      </div>
      <div class="meta-row" data-reveal>
        <a class="btn" href="{{F_URL}}">{{F_CTA}}</a>
{{F_WORLD_LINK}}      </div>
    </div>
  </div>
</section>

{{SERIES_SECTIONS}}

<section class="section">
  <span class="sec-num" aria-hidden="true" data-plx>{{ABOUT_NUM}}</span>
  <div class="sec-mark" data-reveal><span class="idx">{{ABOUT_NUM}}</span><span class="lbl" data-decode>{{T_ABOUT_TEASER}}</span></div>
  <div class="about-grid">
    <div class="brand-plate" data-reveal><img src="{{REL}}assets/img/orb-and-ink-wordmark-lg.png" alt="{{SITE_NAME}}" loading="lazy"></div>
    <div>
      <div class="bio" data-reveal>
        <p>{{AUTHORS_INTRO}}</p>
      </div>
      <a class="btn btn--ghost" href="{{REL}}{{LANG}}/about/" style="margin-top:28px" data-reveal>{{T_ABOUT}}</a>
    </div>
  </div>
</section>
