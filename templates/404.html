<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — {{SITE_NAME}}</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230D0B09'/%3E%3Crect x='4' y='4' width='56' height='56' fill='none' stroke='%23D9A05B' stroke-width='2'/%3E%3Ctext x='32' y='45' font-family='Arial, sans-serif' font-size='36' font-weight='900' fill='%23D9A05B' text-anchor='middle'%3EБ%3C/text%3E%3C/svg%3E">
<style>
html{background:#0A0908;color:#EDE6DC;color-scheme:dark}
body{margin:0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:hidden;
  background:radial-gradient(120vw 80vh at 78% 40%,rgba(70,56,28,.5),transparent 70%),#0A0908}
.nf{position:relative;min-height:100vh;min-height:100svh;display:grid;align-content:center;justify-items:start;padding:0 clamp(20px,6vw,90px)}
.nf::before{content:"";position:absolute;right:clamp(-60px,6vw,140px);top:50%;width:min(62vw,70vh);aspect-ratio:1;border-radius:50%;
  transform:translateY(-50%);z-index:0;pointer-events:none;
  background:radial-gradient(ellipse 22% 14% at 31% 22%,rgba(255,247,228,.8),rgba(255,247,228,.1) 70%,transparent),
    radial-gradient(circle at 70% 80%,rgba(232,172,60,.4),transparent 36%),
    radial-gradient(circle,#17120b 0,#0b0908 56%,#1d160c 82%,#5a4520 95%,#c9a04e 100%);
  box-shadow:0 0 0 1px rgba(232,172,60,.3),0 0 110px rgba(214,174,94,.22)}
.nf>*{position:relative;z-index:1}
.kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#D6AE5E;margin:0}
.nf-code{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-size:clamp(110px,27vw,440px);font-weight:700;line-height:.86;letter-spacing:-.03em;
  background:linear-gradient(172deg,#FBF6EC 30%,#D6AE5E 82%,#7a5e2a 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
.nf p.msg{margin:26px 0 0;font-family:Georgia,"Times New Roman",serif;font-size:clamp(20px,2.4vw,34px);color:#EDE6DC;max-width:22ch;line-height:1.3}
.btn{display:inline-flex;align-items:center;gap:12px;margin-top:34px;min-height:52px;padding:0 28px;border-radius:999px;color:#14100A;font-weight:700;
  text-decoration:none;font-size:12.5px;letter-spacing:.11em;text-transform:uppercase;
  background:linear-gradient(180deg,#E6C988,#D6AE5E 48%,#AD8B49);box-shadow:inset 0 1px 0 rgba(255,255,255,.42),0 16px 36px -16px rgba(214,174,94,.8);
  transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .2s}
.btn::after{content:"→";font-weight:400}
.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #D6AE5E;outline-offset:4px}
[hidden]{display:none !important}
::selection{background:#D6AE5E;color:#14100A}
</style>
</head>
<body>
{{NF_BLOCKS}}
<script>
(function(){
  var langs = "{{LANGS}}".split(",");
  var segs = location.pathname.split("/").filter(Boolean);
  var ix = -1;
  for (var i = 0; i < segs.length; i++) { if (langs.indexOf(segs[i]) >= 0) { ix = i; break; } }
  var lang = ix >= 0 ? segs[ix] : "en";
  var root = ix > 0 ? "/" + segs.slice(0, ix).join("/") + "/" : "/";
  document.documentElement.lang = lang;
  var blocks = document.querySelectorAll("[data-nf]");
  for (var b = 0; b < blocks.length; b++) blocks[b].hidden = blocks[b].getAttribute("data-nf") !== lang;
  var homes = document.querySelectorAll("[data-home]");
  for (var h = 0; h < homes.length; h++) homes[h].setAttribute("href", root + homes[h].getAttribute("data-home") + "/");
})();
</script>
</body>
</html>
